workflows:
  android-debug:
    name: Build YT Web Media APK
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Create Gradle wrapper
        script: |
          gradle wrapper --gradle-version 8.9
      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
